[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atgs"
version = "1.0.0"
description = "ATGS (Arabic Translate Game Skill) - Universal Game Localization Suite & Pixel Art Font Engine"
readme = "README.md"
authors = [{ name = "ATGS Team" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Internationalization"
]
dependencies = [
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "Pillow>=10.0.0"
]

[project.scripts]
atgs = "atgs_cli:main"
